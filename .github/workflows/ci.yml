name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: MoonBit stable checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest MoonBit stable
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          moon version --all

      - name: Format check
        run: moon fmt --check

      - name: Type check
        run: moon check --deny-warn

      - name: Public interface check
        run: |
          moon info
          git diff --exit-code

      - name: Wasm GC tests and coverage
        run: |
          moon test --target wasm-gc --deny-warn --enable-coverage
          moon coverage report -f summary

      - name: Native check and tests
        run: |
          moon check --target native --deny-warn
          moon test --target native --deny-warn
